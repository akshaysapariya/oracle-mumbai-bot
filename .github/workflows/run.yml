name: Oracle Mumbai Capacity Loop

on:
  schedule:
    - cron: '0 */5 * * *' # Automatically spins up a fresh runner every 5 hours
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Oracle Cloud CLI
        run: pip install oci-cli

      - name: Setup OCI Credentials
        run: |
          mkdir -p /home/runner/.oci
          echo "${{ secrets.OCI_CONFIG_FILE }}" > /home/runner/.oci/config
          echo "${{ secrets.OCI_API_KEY }}" > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/oci_api_key.pem

      - name: Run PowerShell Script
        shell: pwsh
        run: |
          $stackId = "ocid1.ormstack.oc1.ap-mumbai-1.amaaaaaa27ugzrqaojordx4plfetepjfzzhefedfwgo5tw3gc5c6kvrsnbra"
          $cfgPath = "/home/runner/.oci/config"
          $startTime = [DateTime]::UtcNow
          
          while ($true) {
              # 1. Keeps your 4-hour cycle limit check (Exits at 240 mins to allow clean shutdown before the 5-hour cron)
              if (([DateTime]::UtcNow - $startTime).TotalMinutes -gt 240) {
                  Write-Host "Reaching 4-hour cycle limits. Gracefully spinning down. Next GitHub cron runner will take over shortly..." -ForegroundColor Yellow
                  break
              }

              Write-Host "$(Get-Date -Format 'HH:mm:ss') - Submitting fast-request to Mumbai data center..." -ForegroundColor Cyan
              
              # 2. Redirect standard error (2>&1) so PowerShell can inspect Oracle's real response text
              $output = oci resource-manager job create-apply-job --stack-id $stackId --execution-plan-strategy "FROM_STACK" --config-file $cfgPath 2>&1

              # 3. Intercept Oracle API Throttling (HTTP 429)
              if ($output -match "TooManyRequests" -or $output -match "429" -or $output -match "throttled") {
                  Write-Host "CRITICAL WARNING: Oracle is throttling your API! Too many requests. Cool-down pause..." -ForegroundColor DarkYellow
                  Start-Sleep -Seconds 600 # Sleep for 10 minutes to let your Oracle API quota reset
                  continue
              }
              
              # 4. Attempt to parse successful JSON
              try {
                  $job = $output | ConvertFrom-Json
                  if ($job) {
                      $state = $job.data.'lifecycle-state'
                      Write-Host "Request acknowledged by Oracle engine. Status: $state" -ForegroundColor Yellow
                      if ($state -eq "SUCCEEDED" -or $state -eq "ACCEPTED" -or $state -eq "IN_PROGRESS") {
                          Write-Host "SUCCESS! Your Always Free Ampere server build has started!" -ForegroundColor Green
                          break
                      }
                  }
              } catch {
                  # Prints real error or indicates standard "out of capacity"
                  Write-Host "Mumbai rack is completely full or out of capacity. Raw details: $output" -ForegroundColor Red
              }
              
              # 5. Standard loop delay
              Start-Sleep -Seconds 180
          }
